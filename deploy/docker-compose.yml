# Whole app on one server: Postgres, API, website (Caddy, automatic HTTPS) and nightly backups.
#   cp .env.example .env   # fill in DOMAIN, POSTGRES_PASSWORD, APP_SECRET
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ohd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ohd
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohd -d ohd"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ohd:${POSTGRES_PASSWORD}@db:5432/ohd
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_HOURS: ${SESSION_HOURS:-72}
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: https://${DOMAIN}
      TZ: Asia/Kolkata
    volumes:
      - uploads:/data/uploads

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Kolkata
    volumes:
      - uploads:/data/uploads:ro
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
